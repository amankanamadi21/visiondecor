services:
  db:
    image: pgvector/pgvector:pg16
    container_name: visiondecor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visiondecor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiondecor_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-visiondecor}
    ports:
      - "5432:5432"
    volumes:
      - visiondecor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visiondecor}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  visiondecor_pgdata:
